name: Attach Verified Build to Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful Build DangoMusic Mod run ID'
        required: true
        type: string
      tag:
        description: 'Existing draft release tag (for example v1.6.0)'
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Verify build and draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh run view "$BUILD_RUN" --json conclusion,headSha,workflowName > build.json
          gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > release.json
          test "$(jq -r .conclusion build.json)" = success
          test "$(jq -r .workflowName build.json)" = 'Build DangoMusic Mod'
          test "$(jq -r .isDraft release.json)" = true
          test "$(jq -r .headSha build.json)" = "$(jq -r .targetCommitish release.json)"
          gh run download "$BUILD_RUN" -n DangoMusic-All-Versions -D dist
          test "$(find dist -maxdepth 1 -name '*.jar' | wc -l)" -eq 11
          for jar in dist/*.jar; do
            case "$(basename "$jar")" in
              DangoMusic-"${RELEASE_TAG#v}"+*.jar) ;;
              *) echo "Unexpected artifact: $jar"; exit 1 ;;
            esac
          done
          gh release upload "$RELEASE_TAG" dist/*.jar --clobber
