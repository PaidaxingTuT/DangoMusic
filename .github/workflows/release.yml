name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate Release Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag and source version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version=//p' version.properties | tr -d '\r')"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          TAG="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "$TAG"
          fi
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null || true
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-modern:
    needs: metadata
    name: Build 1.20.1 ~ 1.21.x (Fabric / Forge / NeoForge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x modern/gradlew

      - name: Test Common
        working-directory: modern
        run: ./gradlew -p ../common :core:test :ui:test --no-daemon

      - name: Build Modern
        working-directory: modern
        run: ./gradlew build --no-daemon

      - name: Collect Modern Jars
        run: |
          mkdir -p output
          for d in modern/versions/*; do
            if [ -d "$d/build/libs" ]; then
              find "$d/build/libs" -maxdepth 1 -name "DangoMusic-*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" ! -name "*-dev-shadow.jar" -exec cp {} output/ \;
            fi
          done
          test "$(find output -maxdepth 1 -name '*.jar' | wc -l)" -eq 6

      - uses: actions/upload-artifact@v4
        with:
          name: DangoMusic-Modern
          path: output/*.jar

  build-modern26:
    needs: metadata
    name: Build 26.x (Fabric / NeoForge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Make gradlew executable
        run: chmod +x modern26/gradlew

      - name: Build 26.x
        working-directory: modern26
        run: ./gradlew build --no-daemon

      - name: Collect 26.x Jars
        run: |
          mkdir -p output
          for d in modern26/versions/*; do
            if [ -d "$d/build/libs" ]; then
              find "$d/build/libs" -maxdepth 1 -name "DangoMusic-*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" ! -name "*-dev-shadow.jar" -exec cp {} output/ \;
            fi
          done
          test "$(find output -maxdepth 1 -name '*.jar' | wc -l)" -eq 4

      - uses: actions/upload-artifact@v4
        with:
          name: DangoMusic-26.x
          path: output/*.jar

  build-legacy:
    name: Build 1.8.9 (Forge)
    needs: [build-modern]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download Modern Artifacts
        uses: actions/download-artifact@v4
        with:
          name: DangoMusic-Modern
          path: output

      - name: Package 1.8.9 Jar
        run: python .github/scripts/patch_189.py

      - uses: actions/upload-artifact@v4
        with:
          name: DangoMusic-1.8.9
          path: output_189/*.jar

  release:
    name: Publish Release
    permissions:
      contents: write
    needs: [metadata, build-modern, build-modern26, build-legacy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Built Jars
        uses: actions/download-artifact@v4
        with:
          pattern: DangoMusic-*
          merge-multiple: true
          path: dist

      - name: Verify artifacts
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -name "DangoMusic-${VERSION}+*.jar" ! -name "*-sources.jar" | wc -l)" -eq 11
          for jar in dist/*.jar; do
            case "$(basename "$jar")" in
              DangoMusic-"${VERSION}"+*.jar) ;;
              *) echo "Unexpected artifact: $jar"; exit 1 ;;
            esac
          done

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft --jq .isDraft > release-state.txt; then
            test "$(cat release-state.txt)" = true
          else
            gh release create "$TAG" --draft --title "$TAG" --notes-file RELEASE_NOTES.md --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" dist/*.jar --clobber
          test "$(gh release view "$TAG" --json assets --jq '.assets | length')" -eq 11
          gh release edit "$TAG" --draft=false --latest --title "$TAG" --notes-file RELEASE_NOTES.md
